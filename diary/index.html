<title>MUJIMUJI STAMP DIARY</title>

<style>
  :root{
    --bg:#FFFFFF;
    --line:#E2E2E2;
    --line-strong:#111111;
    --ink:#111111;
    --ink-soft:#6B6B6B;
    --ink-faint:#A8A8A8;
    --sun:#C8322A;
    --sat:#2F5AA8;
    --focus:#2F5AA8;
    --pad:clamp(10px,2.5vw,34px);
    --sans:"Gothic A1","Helvetica Neue",Arial,sans-serif;
    /* Pretendard는 외부 CDN에서 못 받아오므로(아티팩트 CSP), 설치돼 있으면 로컬 것을 쓰고
       없으면 Gothic A1로 떨어진다 — 어느 쪽이든 0에 점/사선이 없다 */
    --mono:"Pretendard Variable",Pretendard,"Gothic A1",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  body{
    background:#EDEDED; color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    margin:0; padding:0;                 /* 브라우저 기본 여백 제거 — 띠가 창 끝에 붙게 */
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }

  #root{
    width:100%; padding-bottom:var(--pad);
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }

  /* 맨 위 저작권 줄 */
  /* 창 끝까지 붙는 띠 — 좁아지면 줄바꿈해서 가로 스크롤이 생기지 않게 한다 */
  .legal{
    width:100%; padding:6px var(--pad);
    background:#FFFFFF; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:2px 16px;
    font-size:10px; color:#8A8A8A; line-height:1.6;
  }
  .legal span{min-width:0}
  .legal a{color:#8A8A8A}

  /* 저작권 줄 맨 앞의 제품명 */
  .legal .brand{text-transform:uppercase; font-weight:700; color:#5A5A5A; letter-spacing:.04em}

  /* 상단 버튼 줄은 달력과 같은 세로줄 안에 있어서, 편집 패널이 열리면 달력과 함께 움직인다 */
  .bar{width:100%; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .bar .now{margin-right:auto; font-family:var(--mono); font-size:12px; letter-spacing:.12em; color:#767676}
  .btn{
    font-family:var(--mono); font-size:12px; color:#3B3B3B;
    background:#FFFFFF; border:1px solid #CFCFCF; border-radius:2px;
    padding:6px 12px; cursor:pointer;
  }
  .btn:hover{border-color:#8E8E8E}
  .btn[disabled]{opacity:.5; cursor:default}
  .sep{width:1px; height:18px; background:#CFCFCF; margin:0 2px}
  .toggle{
    grid-column:2; grid-row:1; justify-self:start; align-self:center;
    display:flex; align-items:center; gap:7px; cursor:pointer;
    font-size:12px; color:#3B3B3B; user-select:none;
  }
  .toggle input{width:14px; height:14px; accent-color:#111; cursor:pointer; margin:0}
  .bar .toggle{grid-column:auto; grid-row:auto; margin-left:auto}
  /* 달력과 그 아래 버튼 줄을 한 덩어리로 — 달력이 줄어들면 버튼 줄도 같이 줄어든다 */
  .calbody{grid-column:1; grid-row:2; min-width:0; display:flex; flex-direction:column; gap:12px}
  .footbar{width:100%; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .footbar .right{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .workspace.noeditor{grid-template-columns:var(--calw, minmax(0,1fr))}
  .notice{font-size:11px; color:var(--sun)}
  .btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

  /* 버튼 줄(1행) 아래에 달력과 편집 패널이 같은 행에 놓여, 패널 윗선이 달력 윗선과 맞는다 */
  .workspace{
    width:100%; padding:0 var(--pad);
    display:grid; grid-template-columns:var(--calw, minmax(0,1fr)) 372px;
    align-items:start; justify-content:center;
    column-gap:clamp(8px,1.2vw,16px); row-gap:14px;
  }
  .calcol{display:contents}
  .bar{grid-column:1; grid-row:1}
  .sheet{grid-column:1; grid-row:2}
  .sheet{
    background:var(--bg);
    padding:clamp(16px,2.2vw,32px);
    box-shadow:0 1px 2px rgba(0,0,0,.12), 0 14px 34px -18px rgba(0,0,0,.35);
    display:flex; flex-direction:column;
  }
  /* 달력과 같은 행에서 높이를 함께 늘려 항상 아래 끝선이 맞는다 */
  .editorpane{
    grid-column:2; grid-row:2; width:372px; flex:none;
    align-self:start; display:flex;
    background:var(--bg); font-family:var(--sans);
    border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(0,0,0,.12), 0 14px 34px -18px rgba(0,0,0,.35);
  }
  /* 패널은 따로 스크롤하지 않는다 — 높이가 모자라면 페이지 전체가 스크롤된다 */
  .pane-inner{display:flex; flex-direction:column; width:100%; min-width:0}
  .pane-body{flex:1; display:flex; flex-direction:column}
  /* 도형에 따라 컨트롤 수가 줄어도 버튼은 항상 패널 맨 아래에 붙는다 */
  .pane-actions{margin-top:auto}
  .head{display:flex; align-items:baseline; gap:12px; padding-bottom:12px}
  .head .m{font-family:var(--mono); font-weight:500; font-size:clamp(20px,2.4vw,28px); letter-spacing:.06em; line-height:1}
  .head .y{margin-left:auto; font-family:var(--mono); font-size:13px; color:var(--ink-faint); letter-spacing:.14em}
  .head .ko{font-family:var(--mono); font-size:clamp(20px,2.4vw,28px); line-height:1;
    letter-spacing:.06em; font-variant-numeric:tabular-nums; color:var(--ink-soft)}

  /* 칸 폭(--cw)은 화면 높이에 맞춰 스크립트가 정한다 — 창이 넓어져도 달력이 세로로 길어지지 않게 */
  .cal{
    display:grid; grid-template-columns:repeat(7, var(--cw, 1fr)); justify-content:center;
    border-top:1px solid var(--line-strong); border-left:1px solid var(--line);
  }
  .dow{
    font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-soft); text-align:center; padding:9px 0;
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .dow.s{color:var(--sun)}
  .dow.t{color:var(--sat)}

  .cell{
    position:relative; background:#FFFFFF;
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    aspect-ratio:1 / 1.3; padding:6px;
    display:flex; flex-direction:column; gap:2px; min-width:0;
  }
  /* 우표가 있는 칸에 마우스를 올리면 우측 상단에 삭제 버튼 */
  .delbtn{
    position:absolute; top:3px; right:3px; z-index:2;
    width:17px; height:17px; padding:0; line-height:1;
    display:none; align-items:center; justify-content:center;
    font-family:var(--sans); font-size:11px; color:#FFFFFF;
    background:rgba(17,17,17,.72); border:0; border-radius:50%; cursor:pointer;
  }
  .cell:hover .delbtn, .cell:focus-within .delbtn{display:flex}
  .delbtn:hover{background:var(--sun)}
  .delbtn:focus-visible{outline:2px solid var(--focus); outline-offset:1px}
  .cell.drop{outline:2px dashed var(--focus); outline-offset:-3px}
  .cell.sel{outline:2px solid var(--focus); outline-offset:-2px}
  .n{font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums; line-height:1; color:var(--ink)}
  .cell.s .n{color:var(--sun)}
  .cell.t .n{color:var(--sat)}
  .cell.out .n{color:var(--ink-faint)}

  /* 날짜 숫자 아래부터 칸 끝까지가 우표 영역 — 그 안에서 가운데 정렬된다 */
  .slotbtn{
    flex:1; min-height:0; padding:0; border:0; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; width:100%;
  }
  .slotbtn:focus-visible{outline:2px solid var(--focus); outline-offset:-2px}
  .slotbtn canvas{width:100%; height:100%; display:block}

  .foot{
    display:flex; justify-content:space-between; padding-top:10px; gap:12px;
    font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--ink-faint);
  }
  .foot .ko{font-family:var(--sans); letter-spacing:0}

  @media (max-width:900px){
    .cell{padding:3px}
    .n{font-size:11px}
    .dow{font-size:9px; letter-spacing:.04em; padding:6px 0}
    .head .m, .head .ko{font-size:clamp(15px,2.2vw,22px)}
    .sheet{padding:10px}
    .btn{padding:5px 8px; font-size:11px}
  }
  @media print{
    body{background:#fff; padding:0}
    .bar, .editorpane, .toggle, .footbar, .legal{display:none}
    .workspace{display:block}
    .calcol{display:block}
    .sheet{box-shadow:none; max-width:none; width:100%; padding:0}
    .cell.sel{outline:none}
  }

  /* ── 우표 만들기에서 그대로 가져온 컨트롤 스타일 ── */
  input[type="range"].hue-slider{
    -webkit-appearance:none; appearance:none; width:100%; height:14px; border-radius:7px;
    background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
    outline:none; cursor:pointer;
  }
  input[type="range"].hue-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#fff; border:2px solid #333; box-shadow:0 0 2px rgba(0,0,0,.4); cursor:pointer;
  }
  input[type="range"].hue-slider::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%; background:#fff; border:2px solid #333; cursor:pointer;
  }
  input[type="range"].ui-slider{
    -webkit-appearance:none; appearance:none; width:100%; height:16px;
    background:transparent; outline:none; cursor:pointer;
  }
  input[type="range"].ui-slider::-webkit-slider-runnable-track{
    height:6px; border-radius:3px;
    background:linear-gradient(to right,
      var(--thumb-color,#B88A5A) 0%, var(--thumb-color,#B88A5A) var(--fill-percent,0%),
      var(--track-color,#E8DCC3) var(--fill-percent,0%), var(--track-color,#E8DCC3) 100%);
  }
  input[type="range"].ui-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:var(--thumb-color,#B88A5A); border:2px solid rgba(0,0,0,.15); cursor:pointer; margin-top:-5px;
  }
  input[type="range"].ui-slider::-moz-range-track{
    height:6px; border-radius:3px;
    background:linear-gradient(to right,
      var(--thumb-color,#B88A5A) 0%, var(--thumb-color,#B88A5A) var(--fill-percent,0%),
      var(--track-color,#E8DCC3) var(--fill-percent,0%), var(--track-color,#E8DCC3) 100%);
  }
  input[type="range"].ui-slider::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%; background:var(--thumb-color,#B88A5A);
    border:2px solid rgba(0,0,0,.15); cursor:pointer;
  }
  input[type="number"]{-moz-appearance:textfield}
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useRef, useState, useEffect, useLayoutEffect, useCallback, useMemo } = React;

/* ═══════════════════════════════════════════════════════════
   아래 도형·그리기 코드는 "우표 만들기"에서 그대로 가져온 것 —
   톱니 경로, 하트/꽃/별 곡선, 달력 틀, drawStamp 전부 동일하다.
   ═══════════════════════════════════════════════════════════ */

const Icon = ({ children, size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
);
const Upload = ({ size }) => (
  <Icon size={size}>
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
    <polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" />
  </Icon>
);
const RotateCcw = ({ size }) => (
  <Icon size={size}>
    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
    <polyline points="3 3 3 8 8 8" />
  </Icon>
);
const Check = ({ size }) => (<Icon size={size}><polyline points="20 6 9 17 4 12" /></Icon>);
const ImagePlaceholderIcon = ({ size }) => (
  <Icon size={size}>
    <rect x="3" y="3" width="18" height="18" rx="2" />
    <circle cx="8.5" cy="8.5" r="1.5" /><path d="M21 15l-5-5L5 21" />
  </Icon>
);

// 네 변 가운데에만 안쪽으로 오목한 반원 톱니를 배치하고 모서리엔 직선을 남긴다
function traceStampPath(ctx, x, y, w, h, r, spacing, margin, centersOut, skipBeginPath) {
  const edges = [
    { p0: [x, y], d: [1, 0], len: w },
    { p0: [x + w, y], d: [0, 1], len: h },
    { p0: [x + w, y + h], d: [-1, 0], len: w },
    { p0: [x, y + h], d: [0, -1], len: h },
  ];
  if (!skipBeginPath) ctx.beginPath();
  ctx.moveTo(x, y);
  edges.forEach((edge) => {
    const usable = Math.max(0, edge.len - margin * 2);
    const count = Math.max(1, Math.round(usable / spacing));
    const step = usable / count;
    const angleD = Math.atan2(edge.d[1], edge.d[0]);
    for (let i = 0; i < count; i++) {
      const tc = margin + i * step + step / 2;
      const cx = edge.p0[0] + edge.d[0] * tc;
      const cy = edge.p0[1] + edge.d[1] * tc;
      ctx.lineTo(cx - edge.d[0] * r, cy - edge.d[1] * r);
      ctx.arc(cx, cy, r, angleD + Math.PI, angleD, true);
      if (centersOut) centersOut.push([cx, cy]);
    }
    ctx.lineTo(edge.p0[0] + edge.d[0] * edge.len, edge.p0[1] + edge.d[1] * edge.len);
  });
  ctx.closePath();
}

function makeHeartPoints(coeffs, xscale, steps = 160) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const x = xscale * Math.pow(Math.sin(t), 3);
    let y = 0;
    coeffs.forEach((c, idx) => { y += c * Math.cos((idx + 1) * t); });
    pts.push([x, y]);
  }
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  pts.forEach(([x, y]) => {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  });
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const half = Math.max(maxX - minX, maxY - minY) / 2;
  return pts.map(([x, y]) => [(x - cx) / half, (y - cy) / half]);
}
const HEART_POINTS = makeHeartPoints([-13, 5, 2, 1], 16);
const HEART_POINTS_2 = makeHeartPoints([-17.965, 5.548, 2.762, 0.330], 20.388);
const HEART_POINTS_3 = makeHeartPoints([-16.227, 4.469, 3.002, -0.082], 17.667);
const HEART_VARIANTS = [HEART_POINTS, HEART_POINTS_2, HEART_POINTS_3];

function makeFlowerPoints(petals, { floor = 0.3, exponent = 0.55, notch = 0, notchWidth = 0.35, steps = 300 } = {}) {
  const petalAngle = (Math.PI * 2) / petals;
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const local = (((t % petalAngle) + petalAngle) % petalAngle) - petalAngle / 2;
    const u = local / (petalAngle / 2);
    const shape = Math.cos(u * (Math.PI / 2));
    let r = floor + (1 - floor) * Math.pow(Math.max(0, shape), exponent);
    if (notch) r -= notch * Math.exp(-Math.pow(u / notchWidth, 2));
    pts.push([r * Math.cos(t), r * Math.sin(t)]);
  }
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  pts.forEach(([x, y]) => {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  });
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const half = Math.max(maxX - minX, maxY - minY) / 2;
  return pts.map(([x, y]) => [(x - cx) / half, (y - cy) / half]);
}
const FLOWER_POINTS_4 = makeFlowerPoints(4, { floor: 0.42, exponent: 0.6, notch: 0.28, notchWidth: 0.32 });
const FLOWER_POINTS_5 = makeFlowerPoints(5, { floor: 0.3, exponent: 0.55 });
const FLOWER_POINTS_6 = makeFlowerPoints(6, { floor: 0.35, exponent: 0.55 });
const FLOWER_VARIANTS_BY_PETALS = { 4: FLOWER_POINTS_4, 5: FLOWER_POINTS_5, 6: FLOWER_POINTS_6 };
const FLOWER_POINTS = FLOWER_POINTS_5;

function makeStarVertices(spikes = 5, innerRatio = 0.5) {
  const pts = [];
  for (let i = 0; i < spikes * 2; i++) {
    const rr = i % 2 === 0 ? 1 : innerRatio;
    const angle = -Math.PI / 2 + (i * Math.PI) / spikes;
    pts.push([rr * Math.cos(angle), rr * Math.sin(angle)]);
  }
  return pts;
}
function normalizeClosedPoints(pts) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  pts.forEach(([x, y]) => {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  });
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const half = Math.max(maxX - minX, maxY - minY) / 2;
  const norm = pts.map(([x, y]) => [(x - cx) / half, (y - cy) / half]);
  norm.push(norm[0]);
  return norm;
}
// 각 꼭짓점에서 양쪽 변을 cut 만큼 잘라내고, 그 두 점을 꼭짓점을 제어점으로 하는
// 2차 베지어로 이어 모서리를 둥글린다. 예전에는 원호로 이었는데 별의 오목한 꼭짓점처럼
// 각이 급한 곳에서 호가 반대로 돌아 고리가 생겼고, 그 고리가 구멍처럼 뚫려 보였다.
function roundPolygonCorners(points, cut, stepsPerCorner = 10) {
  const n = points.length;
  const out = [];
  for (let i = 0; i < n; i++) {
    const B = points[i], P = points[(i - 1 + n) % n], N = points[(i + 1) % n];
    const v1 = [P[0] - B[0], P[1] - B[1]], v2 = [N[0] - B[0], N[1] - B[1]];
    const l1 = Math.hypot(v1[0], v1[1]) || 1, l2 = Math.hypot(v2[0], v2[1]) || 1;
    const d = Math.min(cut, l1 * 0.5, l2 * 0.5);   // 인접 변의 절반을 넘지 않게
    const T1 = [B[0] + (v1[0] / l1) * d, B[1] + (v1[1] / l1) * d];
    const T2 = [B[0] + (v2[0] / l2) * d, B[1] + (v2[1] / l2) * d];
    for (let s = 0; s <= stepsPerCorner; s++) {
      const t = s / stepsPerCorner, mt = 1 - t;
      out.push([
        mt * mt * T1[0] + 2 * mt * t * B[0] + t * t * T2[0],
        mt * mt * T1[1] + 2 * mt * t * B[1] + t * t * T2[1],
      ]);
    }
  }
  return out;
}

const STAR_POINTS = normalizeClosedPoints(makeStarVertices(5, 0.5));
const STAR_POINTS_2 = normalizeClosedPoints(roundPolygonCorners(makeStarVertices(5, 0.5), 0.2, 14));
const STAR_VARIANTS = [STAR_POINTS, STAR_POINTS_2];

function lineIntersect(p1, p2, p3, p4) {
  const [x1, y1] = p1, [x2, y2] = p2, [x3, y3] = p3, [x4, y4] = p4;
  const d = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
  if (Math.abs(d) < 1e-6) return null;
  const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / d;
  return [x1 + t * (x2 - x1), y1 + t * (y2 - y1)];
}

// 일러스트레이터의 "패스 이동(각진 연결)"과 같은 방식으로 곡선 도형을 안쪽으로 오프셋한다
function traceCurvePath(ctx, x, y, w, h, insetPx, skipBeginPath, points) {
  const cx = x + w / 2, cy = y + h / 2, hw = w / 2, hh = h / 2;
  const base = points.map(([nx, ny]) => [cx + nx * hw, cy + ny * hh]);
  const n = base.length;
  if (!skipBeginPath) ctx.beginPath();
  if (!insetPx) {
    base.forEach(([px, py], i) => (i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py)));
    ctx.closePath();
    return;
  }
  const edgeCount = n - 1;
  const offsetEdges = [];
  for (let i = 0; i < edgeCount; i++) {
    const p0 = base[i], p1 = base[i + 1];
    let dx = p1[0] - p0[0], dy = p1[1] - p0[1];
    const dl = Math.hypot(dx, dy) || 1;
    dx /= dl; dy /= dl;
    let ex = -dy, ey = dx;
    const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
    if (ex * (cx - mx) + ey * (cy - my) < 0) { ex = -ex; ey = -ey; }
    offsetEdges.push({
      a: [p0[0] + ex * insetPx, p0[1] + ey * insetPx],
      b: [p1[0] + ex * insetPx, p1[1] + ey * insetPx],
    });
  }
  const miterLimit = insetPx * 4;
  let started = false;
  const moveOrLine = ([px, py]) => {
    if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
  };
  for (let i = 0; i < edgeCount; i++) {
    const prevEdge = offsetEdges[(i - 1 + edgeCount) % edgeCount];
    const curEdge = offsetEdges[i];
    const inter = lineIntersect(prevEdge.a, prevEdge.b, curEdge.a, curEdge.b);
    if (inter && Math.hypot(inter[0] - base[i][0], inter[1] - base[i][1]) < miterLimit) moveOrLine(inter);
    else { moveOrLine(prevEdge.b); moveOrLine(curEdge.a); }
  }
  ctx.closePath();
}

const PERFORATION_LEVELS = {
  small: { label: "좁게", rMm: 0.42 },
  medium: { label: "보통", rMm: 0.62 },
  large: { label: "넓게", rMm: 0.9 },
};
const PERFORATION_SPACING_RATIO = 3.1;
const PERFORATION_CORNER_MARGIN_RATIO = 1.4;
const BORDER_MM = 1.3;
const BORDER_SEAM_INSET_MM = 0.3;
const COLOR_PALETTE = ["#FFFFFF", "#000000"];
const DEFAULT_SIZE = {
  stamp: { w: 25, h: 28 }, heart: { w: 25, h: 25 }, flower: { w: 25, h: 25 },
  star: { w: 25, h: 25 }, calendar: { w: 25, h: 25 },
};

function curvePointsToIconPath(points, size = 26, pad = 3) {
  const inner = size - pad * 2;
  return points.map(([nx, ny], i) => {
    const px = pad + ((nx + 1) / 2) * inner;
    const py = pad + ((ny + 1) / 2) * inner;
    return `${i === 0 ? "M" : "L"}${px.toFixed(2)},${py.toFixed(2)}`;
  }).join(" ") + " Z";
}

function hsvToRgb(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}
function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map((v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, "0")).join("").toUpperCase();
}
function hsvToHex(h, s, v) { const [r, g, b] = hsvToRgb(h, s, v); return rgbToHex(r, g, b); }
function hexToRgb(hex) {
  const clean = (hex || "").replace("#", "").trim();
  const full = clean.length === 3 ? clean.split("").map((c) => c + c).join("") : clean;
  const num = parseInt(full, 16);
  if (full.length !== 6 || isNaN(num)) return [0, 0, 0];
  return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
}
function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return { h, s: max === 0 ? 0 : d / max, v: max };
}
function hexToHsv(hex) { const [r, g, b] = hexToRgb(hex); return rgbToHsv(r, g, b); }

const SLIDER_LABEL_WIDTH = 78, SLIDER_ROW_GAP = 8, SLIDER_SLOT_WIDTH = 58;

function SliderRow({ label, value, min, max, step, unit, onChange, T, swatch }) {
  const pct = ((value - min) / (max - min)) * 100;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: SLIDER_ROW_GAP, marginBottom: 10 }}>

      <input type="range" className="ui-slider" min={min} max={max} step={step} value={value}
        onChange={(e) => onChange(Number(e.target.value))}

      <span style={{ width: SLIDER_SLOT_WIDTH, display: "flex", justifyContent: "flex-end", flexShrink: 0 }}>{swatch || null}</span>

function SwatchBox({ color, onClick, active, T, width = 34, height = 26 }) {
  return (
    <button type="button" onClick={onClick} title="색상 변경"
      style={{ width, height, borderRadius: 4, border: active ? `2px solid ${T.accent}` : `1px solid ${T.border}`,

function roundedRectPath(ctx, x, y, w, h, r) {
  const rad = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.lineTo(x + w - rad, y);
  ctx.arcTo(x + w, y, x + w, y + rad, rad);
  ctx.lineTo(x + w, y + h - rad);
  ctx.arcTo(x + w, y + h, x + w - rad, y + h, rad);
  ctx.lineTo(x + rad, y + h);
  ctx.arcTo(x, y + h, x, y + h - rad, rad);
  ctx.lineTo(x, y + rad);
  ctx.arcTo(x, y, x + rad, y, rad);
  ctx.closePath();
}

function calendarLayout(canvasW, canvasH, stampW, stampH, calendarInnerShape = "rect") {
  const topMarginFrac = 0.14, bottomMarginFrac = 0.05;
  const availH = canvasH * (1 - topMarginFrac - bottomMarginFrac);
  const pxPerMm = Math.min(canvasW / stampW, availH / stampH);
  const dispW = stampW * pxPerMm, dispH = stampH * pxPerMm;
  const originX = (canvasW - dispW) / 2;
  const originY = canvasH * topMarginFrac + (availH - dispH) / 2;
  const cornerR = Math.min(dispW, dispH) * 0.11;
  const headerH = dispH * 0.15;
  const pad = Math.min(dispW, dispH) * 0.10;
  const isCurveInner = calendarInnerShape === "heart" || calendarInnerShape === "flower" || calendarInnerShape === "star";
  const imgPad = isCurveInner ? pad * 0.35 : pad;
  const imgX = originX + imgPad, imgY = originY + headerH + imgPad;
  const imgW = Math.max(1, dispW - imgPad * 2);
  const imgH = Math.max(1, dispH - headerH - imgPad * 2);
  return { pxPerMm, dispW, dispH, originX, originY, cornerR, headerH, pad, imgPad, imgX, imgY, imgW, imgH };
}

function drawCalendarFrame(ctx, {
  canvasW, canvasH, stampW, stampH, img, offX, offY, scale, rotation, checker,
  calendarBorderColor = "#333333", calendarHeaderColor = "#F4D9A0", calendarSpringColor = "#2E3A46",
  calendarBorderWidthMm = 1.0, calendarInnerShape = "rect",
  heartStyle = 1, petalCount = 5, starStyle = 1, perforation = "medium",
}) {
  ctx.clearRect(0, 0, canvasW, canvasH);
  const { pxPerMm, dispW, dispH, originX, originY, cornerR, headerH, imgX, imgY, imgW, imgH } =
    calendarLayout(canvasW, canvasH, stampW, stampH, calendarInnerShape);
  const borderWidthPx = Math.max(1, calendarBorderWidthMm * pxPerMm);

  ctx.save();
  roundedRectPath(ctx, originX, originY, dispW, dispH, cornerR);
  ctx.clip();
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(originX, originY, dispW, dispH);
  ctx.fillStyle = calendarHeaderColor;
  ctx.fillRect(originX, originY, dispW, headerH);

  ctx.save();
  ctx.beginPath();
  if (calendarInnerShape === "stamp") {
    const level = PERFORATION_LEVELS[perforation] || PERFORATION_LEVELS.medium;
    const r = Math.min(level.rMm * pxPerMm, Math.min(imgW, imgH) / 10);
    traceStampPath(ctx, imgX, imgY, imgW, imgH, r, r * PERFORATION_SPACING_RATIO, r * PERFORATION_CORNER_MARGIN_RATIO, null, true);
  } else if (calendarInnerShape === "heart" || calendarInnerShape === "flower" || calendarInnerShape === "star") {
    const innerPoints = calendarInnerShape === "flower"
      ? (FLOWER_VARIANTS_BY_PETALS[petalCount] || FLOWER_POINTS)
      : calendarInnerShape === "star" ? (STAR_VARIANTS[starStyle - 1] || STAR_POINTS)
      : (HEART_VARIANTS[heartStyle - 1] || HEART_POINTS);
    const shapeSize = Math.min(imgW, imgH);
    traceCurvePath(ctx, imgX + (imgW - shapeSize) / 2, imgY + (imgH - shapeSize) / 2, shapeSize, shapeSize, 0, true, innerPoints);
  } else {
    ctx.rect(imgX, imgY, imgW, imgH);
  }
  ctx.clip();

  if (checker) {
    const cs = 10;
    for (let cy = imgY; cy < imgY + imgH; cy += cs) {
      for (let cx = imgX; cx < imgX + imgW; cx += cs) {
        const on = (Math.floor((cx - imgX) / cs) + Math.floor((cy - imgY) / cs)) % 2 === 0;
        ctx.fillStyle = on ? "#FAFAFA" : "#DCDCDC";
        ctx.fillRect(cx, cy, cs, cs);
      }
    }
  }
  if (img) {
    ctx.save();
    const cx = imgX + imgW / 2 + offX * imgW, cy = imgY + imgH / 2 + offY * imgH;
    const baseScale = Math.max(imgW / img.naturalWidth, imgH / img.naturalHeight);
    ctx.translate(cx, cy);
    ctx.rotate((rotation * Math.PI) / 180);
    ctx.scale(scale, scale);
    ctx.drawImage(img, (-img.naturalWidth * baseScale) / 2, (-img.naturalHeight * baseScale) / 2,
      img.naturalWidth * baseScale, img.naturalHeight * baseScale);
    ctx.restore();
  }
  ctx.restore();
  ctx.restore();

  ctx.strokeStyle = calendarBorderColor;
  ctx.lineWidth = borderWidthPx;
  roundedRectPath(ctx, originX, originY, dispW, dispH, cornerR);
  ctx.stroke();

  const springW = dispW * 0.092;
  const springTopY = originY - dispH * 0.09;
  const springBottomY = originY + headerH * 0.58;
  [0.226, 0.774].forEach((fx) => {
    const cx = originX + dispW * fx;
    ctx.fillStyle = calendarSpringColor;
    roundedRectPath(ctx, cx - springW / 2, springTopY, springW, springBottomY - springTopY, springW / 2);
    ctx.fill();
  });
}

function drawStamp(ctx, {
  canvasW, canvasH, stampW, stampH, img, offX, offY, scale, rotation, checker,
  shape = "stamp", heartStyle = 1, petalCount = 5, starStyle = 1,
  calendarBorderColor = "#333333", calendarHeaderColor = "#F4D9A0", calendarSpringColor = "#2E3A46",
  calendarBorderWidthMm = 1.0, calendarInnerShape = "rect",
  perforation = "medium", borderOn = false, borderColor = "#FFFFFF",
  lineBorderMode = "none", lineBorderWidthMm = 0.6, lineBorderWidthMm2 = 0.6,
  lineBorderColor = "#FFFFFF", lineBorderColor2 = "#FFFFFF",
  lineBorderInsetMm = 1.4, lineBorderInset2Mm = 3.0,
}) {
  if (shape === "calendar") {
    drawCalendarFrame(ctx, {
      canvasW, canvasH, stampW, stampH, img, offX, offY, scale, rotation, checker,
      calendarBorderColor, calendarHeaderColor, calendarSpringColor,
      calendarBorderWidthMm, calendarInnerShape, heartStyle, petalCount, starStyle, perforation,
    });
    return;
  }
  ctx.clearRect(0, 0, canvasW, canvasH);

  const pxPerMm = Math.min(canvasW / stampW, canvasH / stampH);
  const dispW = stampW * pxPerMm, dispH = stampH * pxPerMm;
  const originX = (canvasW - dispW) / 2, originY = (canvasH - dispH) / 2;
  const isStamp = shape === "stamp";

  const level = PERFORATION_LEVELS[perforation] || PERFORATION_LEVELS.medium;
  const r = Math.min(level.rMm * pxPerMm, Math.min(dispW, dispH) / 10);
  const spacing = r * PERFORATION_SPACING_RATIO;
  const margin = r * PERFORATION_CORNER_MARGIN_RATIO;

  const curvePoints = shape === "flower" ? (FLOWER_VARIANTS_BY_PETALS[petalCount] || FLOWER_POINTS)
    : shape === "star" ? (STAR_VARIANTS[starStyle - 1] || STAR_POINTS)
    : (HEART_VARIANTS[heartStyle - 1] || HEART_POINTS);
  const tracePath = (x, y, w, h, insetPx, centersOut, skipBeginPath) => {
    if (isStamp) traceStampPath(ctx, x, y, w, h, r, spacing, margin, centersOut, skipBeginPath);
    else traceCurvePath(ctx, x, y, w, h, insetPx, skipBeginPath, curvePoints);
  };

  const borderPx = Math.min(BORDER_MM * pxPerMm, Math.min(dispW, dispH) / 3);
  const contentX = originX + borderPx, contentY = originY + borderPx;
  const contentW = Math.max(1, dispW - borderPx * 2), contentH = Math.max(1, dispH - borderPx * 2);

  const centers = [];
  ctx.save();
  tracePath(originX, originY, dispW, dispH, 0, centers);
  ctx.clip();

  if (checker) {
    const cs = 10;
    for (let cy = originY; cy < originY + dispH; cy += cs) {
      for (let cx = originX; cx < originX + dispW; cx += cs) {
        const on = (Math.floor((cx - originX) / cs) + Math.floor((cy - originY) / cs)) % 2 === 0;
        ctx.fillStyle = on ? "#FAFAFA" : "#DCDCDC";
        ctx.fillRect(cx, cy, cs, cs);
      }
    }
  }

  const borderSeamInsetPx = BORDER_SEAM_INSET_MM * pxPerMm;
  const seamX = contentX + borderSeamInsetPx, seamY = contentY + borderSeamInsetPx;
  const seamW = Math.max(1, contentW - borderSeamInsetPx * 2);
  const seamH = Math.max(1, contentH - borderSeamInsetPx * 2);

  if (img) {
    ctx.save();
    if (borderOn && isStamp) {
      ctx.beginPath();
      ctx.rect(seamX, seamY, seamW, seamH);
      ctx.clip();
    }
    const cx = originX + dispW / 2 + offX * dispW, cy = originY + dispH / 2 + offY * dispH;
    const baseScale = Math.max(dispW / img.naturalWidth, dispH / img.naturalHeight);
    ctx.translate(cx, cy);
    ctx.rotate((rotation * Math.PI) / 180);
    ctx.scale(scale, scale);
    ctx.drawImage(img, (-img.naturalWidth * baseScale) / 2, (-img.naturalHeight * baseScale) / 2,
      img.naturalWidth * baseScale, img.naturalHeight * baseScale);
    ctx.restore();
  }

  if (borderOn) {
    const overlapPx = 1;
    if (isStamp) {
      const holeInsetPx = borderSeamInsetPx + overlapPx;
      ctx.beginPath();
      tracePath(originX, originY, dispW, dispH, 0, null, true);
      ctx.rect(contentX + holeInsetPx, contentY + holeInsetPx,
        Math.max(1, contentW - holeInsetPx * 2), Math.max(1, contentH - holeInsetPx * 2));
      ctx.fillStyle = borderColor;
      ctx.fill("evenodd");
    } else {
      const ringWidthPx = borderPx + borderSeamInsetPx + overlapPx;
      ctx.beginPath();
      tracePath(originX, originY, dispW, dispH, 0, null, true);
      ctx.lineJoin = "round";
      ctx.lineWidth = ringWidthPx * 2;
      ctx.strokeStyle = borderColor;
      ctx.stroke();
    }
  }

  if (lineBorderMode !== "none") {
    const baseX = borderOn ? contentX : originX, baseY = borderOn ? contentY : originY;
    const baseW = borderOn ? contentW : dispW, baseH = borderOn ? contentH : dispH;
    const outerInset = lineBorderInsetMm * pxPerMm, inset2 = lineBorderInset2Mm * pxPerMm;
    const lines = lineBorderMode === "double"
      ? [{ inset: outerInset, widthPx: Math.max(0.6, lineBorderWidthMm * pxPerMm), color: lineBorderColor },
         { inset: inset2, widthPx: Math.max(0.6, lineBorderWidthMm2 * pxPerMm), color: lineBorderColor2 }]
      : [{ inset: outerInset, widthPx: Math.max(0.6, lineBorderWidthMm * pxPerMm), color: lineBorderColor }];
    lines.forEach(({ inset, widthPx, color }) => {
      if (isStamp) {
        const w = baseW - inset * 2, h = baseH - inset * 2;
        if (w > 2 && h > 2) {
          ctx.strokeStyle = color; ctx.lineWidth = widthPx;
          ctx.strokeRect(baseX + inset, baseY + inset, w, h);
        }
      } else {
        ctx.beginPath();
        tracePath(baseX, baseY, baseW, baseH, inset, null);
        ctx.strokeStyle = color; ctx.lineWidth = widthPx; ctx.stroke();
      }
    });
  }
  ctx.restore();

  if (isStamp) {
    ctx.save();
    traceStampPath(ctx, originX, originY, dispW, dispH, r, spacing, margin);
    ctx.clip();
    if (borderOn) { ctx.beginPath(); ctx.rect(seamX, seamY, seamW, seamH); ctx.clip(); }
    ctx.strokeStyle = "rgba(0,0,0,0.16)";
    ctx.lineWidth = Math.max(1, pxPerMm * 0.09);
    // 톱니 원만 그리면 톱니가 없는 모서리 직선 구간에는 테가 없어서, 배경이 투명한
    // 이미지에서 그쪽만 가장자리가 사라져 보인다. 외곽선 전체를 한 번 더 그린다
    // (도형으로 클립돼 있어 바깥쪽 절반은 잘리고 안쪽 절반만 남는다).
    traceStampPath(ctx, originX, originY, dispW, dispH, r, spacing, margin);
    ctx.stroke();
    centers.forEach(([cx, cy]) => { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); });
    ctx.restore();
  }
  return { originX, originY, dispW, dispH };
}

// 그리기 함수에 넘길 옵션으로 변환 — 여백/내부 테두리는 우표 모양에서만 적용된다
function drawOptions(s) {

const MONTH = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const DOWK = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
const pad = (n) => (n < 10 ? "0" : "") + n;
const dkey = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;

const imgCache = new Map();
function loadImage(src) {
  if (imgCache.has(src)) return imgCache.get(src);
  const p = new Promise((res, rej) => {
    const im = new window.Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = src;
  });
  imgCache.set(src, p);
  return p;
}
// 원본을 그대로 저장하면 브라우저 저장 공간이 금방 차서, 긴 변 1000px로 줄여 담는다
function shrink(dataUrl) {
  return loadImage(dataUrl).then((im) => {
    const max = 1600;
    const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    if (k === 1 && dataUrl.length < 700000) return dataUrl;
    const c = document.createElement("canvas");
    c.width = Math.round(im.naturalWidth * k);
    c.height = Math.round(im.naturalHeight * k);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    let out = c.toDataURL("image/webp", 0.88);
    if (out.indexOf("data:image/webp") !== 0) out = c.toDataURL("image/png");
    return out;
  });
}

/* ── 오른쪽 편집 패널 (우표 만들기 패널 그대로) ── */
function StampEditorPanel({ date, initial, onApply, onDelete, onClose }) {
  const base = { ...DEFAULT_STAMP, ...(initial || {}) };
  const [src, setSrc] = useState(initial && initial.src ? initial.src : null);
  const [img, setImg] = useState(null);
  const [stampW, setStampW] = useState(base.stampW);
  const [stampH, setStampH] = useState(base.stampH);
  const [offX, setOffX] = useState(base.offX);
  const [offY, setOffY] = useState(base.offY);
  const [scale, setScale] = useState(base.scale);
  const [rotation, setRotation] = useState(base.rotation);
  const [perforation, setPerforation] = useState(base.perforation);
  const [borderOn, setBorderOn] = useState(base.borderOn);
  const [borderColor, setBorderColor] = useState(base.borderColor);
  const [lineBorderOn, setLineBorderOn] = useState(base.lineBorderOn);
  const [lineBorderMode, setLineBorderMode] = useState(base.lineBorderMode);
  const [lineBorderWidthMm, setLineBorderWidthMm] = useState(base.lineBorderWidthMm);
  const [lineBorderWidthMm2, setLineBorderWidthMm2] = useState(base.lineBorderWidthMm2);
  const [lineBorderColor, setLineBorderColor] = useState(base.lineBorderColor);
  const [lineBorderColor2, setLineBorderColor2] = useState(base.lineBorderColor2);
  const [lineBorderInsetMm, setLineBorderInsetMm] = useState(base.lineBorderInsetMm);
  const [lineBorderInset2Mm, setLineBorderInset2Mm] = useState(base.lineBorderInset2Mm);
  const [openColorPicker, setOpenColorPicker] = useState(null);
  const [pickerHsv, setPickerHsv] = useState({ h: 0, s: 0, v: 1 });
  const [shape, setShape] = useState(base.shape);
  const [heartStyle, setHeartStyle] = useState(base.heartStyle);
  const [petalCount, setPetalCount] = useState(base.petalCount);
  const [starStyle, setStarStyle] = useState(base.starStyle);
  const [calendarBorderColor, setCalendarBorderColor] = useState(base.calendarBorderColor);
  const [calendarHeaderColor, setCalendarHeaderColor] = useState(base.calendarHeaderColor);
  const [calendarSpringColor, setCalendarSpringColor] = useState(base.calendarSpringColor);
  const [calendarBorderWidthMm, setCalendarBorderWidthMm] = useState(base.calendarBorderWidthMm);
  const [calendarInnerShape, setCalendarInnerShape] = useState(base.calendarInnerShape);
  const [msg, setMsg] = useState("");

  const effectiveLineBorderMode = lineBorderOn && shape === "stamp" ? lineBorderMode : "none";
  const effectiveBorderOn = borderOn && shape === "stamp";

  const canvasRef = useRef(null);
  const fileInputRef = useRef(null);
  const dragState = useRef(null);
  const STAGE = 300;

  useEffect(() => {
    if (!src) { setImg(null); return; }
    let alive = true;
    loadImage(src).then((im) => { if (alive) setImg(im); }).catch(() => setMsg("이미지를 읽지 못했습니다."));
    return () => { alive = false; };
  }, [src]);

  const redraw = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    canvas.width = STAGE; canvas.height = STAGE;
    drawStamp(canvas.getContext("2d"), {
      canvasW: STAGE, canvasH: STAGE, stampW, stampH, img, offX, offY, scale, rotation,
      checker: true, shape, heartStyle, petalCount, starStyle,
      calendarBorderColor, calendarHeaderColor, calendarSpringColor,
      calendarBorderWidthMm, calendarInnerShape, perforation,
      borderOn: effectiveBorderOn, borderColor,
      lineBorderMode: effectiveLineBorderMode, lineBorderWidthMm, lineBorderWidthMm2,
      lineBorderColor, lineBorderColor2, lineBorderInsetMm, lineBorderInset2Mm,
    });
  }, [stampW, stampH, img, offX, offY, scale, rotation, shape, heartStyle, petalCount, starStyle,
      calendarBorderColor, calendarHeaderColor, calendarSpringColor, calendarBorderWidthMm, calendarInnerShape,
      perforation, effectiveBorderOn, borderColor, effectiveLineBorderMode, lineBorderWidthMm,
      lineBorderWidthMm2, lineBorderColor, lineBorderColor2, lineBorderInsetMm, lineBorderInset2Mm]);

  useEffect(() => { redraw(); }, [redraw]);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    const onPaste = (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image/") === 0) { takeFile(items[i].getAsFile()); e.preventDefault(); return; }
      }
    };
    document.addEventListener("keydown", onKey);
    document.addEventListener("paste", onPaste);
    return () => { document.removeEventListener("keydown", onKey); document.removeEventListener("paste", onPaste); };
  });

  const takeFile = (file) => {
    if (!file || !/^image\//.test(file.type)) { setMsg("이미지 파일만 넣을 수 있습니다."); return; }
    const reader = new FileReader();
    reader.onload = () => {
      setMsg("");
      shrink(reader.result).then((s) => {
        setSrc(s); setOffX(0); setOffY(0); setScale(1); setRotation(0);
      });
    };
    reader.onerror = () => setMsg("파일을 읽지 못했습니다.");
    reader.readAsDataURL(file);
  };

  const onPointerDown = (e) => {
    if (!img) return;
    const rect = canvasRef.current.getBoundingClientRect();
    dragState.current = { startX: e.clientX, startY: e.clientY, offX, offY, rectW: rect.width, rectH: rect.height };
    canvasRef.current.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!dragState.current) return;
    const { startX, startY, offX: bx, offY: by, rectW, rectH } = dragState.current;
    setOffX(bx + (e.clientX - startX) / rectW);
    setOffY(by + (e.clientY - startY) / rectH);
  };
  const onPointerUp = () => { dragState.current = null; };

  const resetTransform = () => { setOffX(0); setOffY(0); setScale(1); setRotation(0); };
  const resetSize = () => {
    const d = DEFAULT_SIZE[shape] || DEFAULT_SIZE.stamp;
    setStampW(d.w); setStampH(d.h);
  };
  const changeShape = (next) => {
    setShape(next);
    const d = DEFAULT_SIZE[next] || DEFAULT_SIZE.stamp;
    setStampW(d.w); setStampH(d.h);
  };

  const toggleColorPicker = (key, currentHex) => {
    setOpenColorPicker((prev) => {
      const next = prev === key ? null : key;
      if (next) setPickerHsv(hexToHsv(currentHex));
      return next;
    });
  };
  const handleSvPointer = (e, onChange) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const s = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    const v = 1 - Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
    setPickerHsv((prev) => { onChange(hsvToHex(prev.h, s, v)); return { h: prev.h, s, v }; });
  };
  const handleHueChange = (h, onChange) => {
    setPickerHsv((prev) => { onChange(hsvToHex(h, prev.s, prev.v)); return { h, s: prev.s, v: prev.v }; });
  };

  const apply = () => {
    if (!date) { setMsg("먼저 달력에서 붙일 칸을 선택하세요."); return; }
    if (!src) { setMsg("먼저 이미지를 넣어주세요."); return; }
    Promise.resolve(onApply({
      src, shape, stampW, stampH, offX, offY, scale, rotation, perforation,
      borderOn, borderColor, lineBorderOn, lineBorderMode,
      lineBorderWidthMm, lineBorderWidthMm2, lineBorderColor, lineBorderColor2,
      lineBorderInsetMm, lineBorderInset2Mm, heartStyle, petalCount, starStyle,
      calendarBorderColor, calendarHeaderColor, calendarSpringColor,
      calendarBorderWidthMm, calendarInnerShape,
    })).then((ok) => {
      setMsg(ok ? "" : "저장하지 못했습니다. 저장 공간을 확인해 주세요.");
    });
  };

  const renderColorPicker = (key, value, onChange) => {
    if (openColorPicker !== key) return null;
    return (
      <div style={{ marginTop: 8, padding: 10, borderRadius: 8, background: T.inputBg, border: `1px solid ${T.border}` }}>
        <div
          onPointerDown={(e) => { e.currentTarget.setPointerCapture(e.pointerId); handleSvPointer(e, onChange); }}
          onPointerMove={(e) => e.buttons === 1 && handleSvPointer(e, onChange)}
          style={{
            position: "relative", width: "100%", height: 120, borderRadius: 6, marginBottom: 10, cursor: "crosshair",
            background: `linear-gradient(to top, #000, rgba(0,0,0,0)), linear-gradient(to right, #fff, rgba(255,255,255,0)), hsl(${pickerHsv.h}, 100%, 50%)`,
          }}>
          <div style={{
            position: "absolute", left: `calc(${pickerHsv.s * 100}% - 7px)`, top: `calc(${(1 - pickerHsv.v) * 100}% - 7px)`,
            width: 14, height: 14, borderRadius: "50%", border: "2px solid #fff",
            boxShadow: "0 0 0 1px rgba(0,0,0,0.4)", pointerEvents: "none" }} />
        </div>
        <input type="range" className="hue-slider" min={0} max={359} value={Math.round(pickerHsv.h)}
          onChange={(e) => handleHueChange(Number(e.target.value), onChange)}
          style={{ marginBottom: 10, display: "block" }} />
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
          {COLOR_PALETTE.map((c) => (
            <button key={c} type="button" onClick={() => { onChange(c); setPickerHsv(hexToHsv(c)); }}
              style={{ width: 22, height: 22, borderRadius: 5,
                border: value.toLowerCase() === c.toLowerCase() ? `2px solid ${T.accent}` : "none",
                background: c, cursor: "pointer", padding: 0 }} />
          ))}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ width: 22, height: 22, borderRadius: 5, background: value, flexShrink: 0 }} />
          <input type="text" value={value} spellCheck={false}
            onChange={(e) => { const v = e.target.value; onChange(v); if (/^#[0-9a-fA-F]{6}$/.test(v)) setPickerHsv(hexToHsv(v)); }}
            style={{ flex: 1, padding: "6px 8px", borderRadius: 6, border: `1px solid ${T.border}`,
              background: "#fff", color: T.text, fontSize: 12 }} />
          <button type="button" onClick={() => setOpenColorPicker(null)}
            style={{ padding: "6px 10px", fontSize: 12, color: T.onAccent, background: T.accent,
              border: "none", borderRadius: 6, cursor: "pointer", whiteSpace: "nowrap" }}>닫기</button>
        </div>
      </div>
    );
  };

  const p = date ? date.split("-") : null;
  const dowLabel = p ? DOWK[new Date(+p[0], +p[1] - 1, +p[2]).getDay()] : "";

  return (
    <aside className="editorpane" aria-label="우표 편집"
      onDragOver={(e) => e.preventDefault()}
      onDrop={(e) => { e.preventDefault(); takeFile(e.dataTransfer.files[0]); }}>
      <div className="pane-inner">
        <div style={{ padding: "34px 22px 14px", textAlign: "center", position: "relative" }}>
          <button onClick={onClose} aria-label="닫기"
            style={{ position: "absolute", top: 12, right: 14, background: "none", border: 0,
              fontSize: 17, color: T.muted, cursor: "pointer", lineHeight: 1, padding: 4 }}>✕</button>
          {/* 어느 칸을 편집 중인지 — 패널에서 가장 먼저 눈에 들어와야 하는 정보 */}
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
            <span style={{ fontFamily: "Pretendard Variable, Pretendard, Gothic A1, -apple-system, Segoe UI, Malgun Gothic, sans-serif",
              fontSize: 22, letterSpacing: "0.04em", lineHeight: 1,
              color: p ? T.onPanel : T.disabled }}>
              {p ? `${p[0]}.${p[1]}.${p[2]}` : "날짜 미선택"}
            </span>
            <span style={{ fontSize: 12, color: T.muted, letterSpacing: "0.02em" }}>
              {p ? dowLabel : "달력에서 칸을 고르세요"}
            </span>
          </div>
          <div style={{ display: "flex", justifyContent: "center", gap: 6, marginTop: 20, flexWrap: "wrap" }}>
            {[{ key: "stamp", label: "우표" }, { key: "heart", label: "하트" }, { key: "flower", label: "꽃" },
              { key: "star", label: "별" }, { key: "calendar", label: "달력" }].map((opt) => {
              const active = shape === opt.key;
              return (
                <button key={opt.key} onClick={() => changeShape(opt.key)}
                  style={{ padding: "5px 12px", fontSize: 11, fontWeight: active ? 700 : 500,
                    color: active ? T.onAccent : T.muted, background: active ? T.accent : "transparent",
                    border: `1px solid ${active ? T.accent : T.border}`, borderRadius: 999, cursor: "pointer" }}>
                  {opt.label}
                </button>
              );
            })}
          </div>
        </div>

        <div style={{ padding: "10px 22px 6px", display: "flex", justifyContent: "center" }}>
          <div style={{ position: "relative", width: "100%", maxWidth: STAGE, aspectRatio: "1 / 1" }}>
            <canvas ref={canvasRef} width={STAGE} height={STAGE}
              onPointerDown={onPointerDown} onPointerMove={onPointerMove}
              onPointerUp={onPointerUp} onPointerLeave={onPointerUp}
              style={{ width: "100%", height: "100%", touchAction: "none", cursor: img ? "grab" : "default",
                display: "block", filter: "drop-shadow(0 10px 18px rgba(59,42,32,0.3))" }} />
            {!img && (
              <div style={{ position: "absolute",
                ...(shape === "calendar"
                  ? (() => {
                      const l = calendarLayout(STAGE, STAGE, stampW, stampH, calendarInnerShape);
                      const pc = (v) => (v / STAGE) * 100 + "%";
                      return { left: pc(l.imgX), top: pc(l.imgY), width: pc(l.imgW), height: pc(l.imgH) };
                    })()
                  : { inset: 0 }),
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                gap: 8, color: T.muted, pointerEvents: "none" }}>
                <ImagePlaceholderIcon size={26} />
              </div>
            )}
          </div>
        </div>

        <div style={{ padding: "8px 22px 4px" }}>
          <input ref={fileInputRef} type="file" accept="image/*"
            onChange={(e) => { takeFile(e.target.files && e.target.files[0]); e.target.value = ""; }}
            style={{ display: "none" }} />
          <button onClick={() => fileInputRef.current && fileInputRef.current.click()}
            style={{ width: "100%", padding: "11px 0", background: T.accent, color: T.onAccent, border: "none",
              borderRadius: 8, fontSize: 14, fontWeight: 600, display: "flex", alignItems: "center",
              justifyContent: "center", gap: 8, cursor: "pointer" }}>
            <Upload size={16} /> 이미지 선택
          </button>
          <div style={{ textAlign: "center", fontSize: 11, color: T.muted, marginTop: 16 }}>
            드래그로 위치 조절 · 창에 끌어다 놓거나 Ctrl+V 로도 넣을 수 있어요
          </div>
          {msg && <div style={{ textAlign: "center", fontSize: 11, color: T.accent, marginTop: 6 }}>{msg}</div>}
        </div>

        <div className="pane-body" style={{ padding: "18px 22px 0" }}>
          <div style={{ paddingTop: 14 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ fontSize: 12, fontWeight: 700, color: T.muted, whiteSpace: "nowrap" }}>사이즈</span>
              <input type="number" value={stampW} min={5} max={30}
                onChange={(e) => setStampW(Math.min(30, Number(e.target.value) || 1))}
                style={{ width: 46, padding: "7px 6px", borderRadius: 6, border: `1px solid ${T.border}`,
                  background: "#FFFFFF", color: T.text, fontSize: 13, textAlign: "center" }} />
              <span style={{ fontSize: 12, color: T.muted }}>X</span>
              <input type="number" value={stampH} min={5} max={30}
                onChange={(e) => setStampH(Math.min(30, Number(e.target.value) || 1))}
                style={{ width: 46, padding: "7px 6px", borderRadius: 6, border: `1px solid ${T.border}`,
                  background: "#FFFFFF", color: T.text, fontSize: 13, textAlign: "center" }} />
              <span style={{ fontSize: 11, color: T.muted, whiteSpace: "nowrap" }}>mm(최대 30mm)</span>
              <button onClick={resetSize}
                style={{ marginLeft: "auto", padding: "7px 10px", fontSize: 12, color: T.accentSoft,
                  background: "transparent", border: `1px solid ${T.accentSoft}`, borderRadius: 6,
                  cursor: "pointer", whiteSpace: "nowrap" }}>기본값</button>
            </div>
          </div>

          <div style={{ paddingTop: 16 }}>
            <div style={{ display: "flex", alignItems: "center", gap: SLIDER_ROW_GAP, marginBottom: 10 }}>
              <span style={{ fontSize: 12, color: T.muted, width: SLIDER_LABEL_WIDTH, flexShrink: 0 }}>확대/축소</span>
              <input type="range" className="ui-slider" min={0.5} max={3} step={0.05} value={scale}
                onChange={(e) => setScale(Number(e.target.value))}
                style={{ flex: 1, minWidth: 0, "--track-color": T.sliderTrack, "--thumb-color": T.accent,
                  "--fill-percent": `${((scale - 0.5) / 2.5) * 100}%` }} />
              <span style={{ fontSize: 12, color: T.muted, width: 42, textAlign: "right" }}>{scale.toFixed(2)}x</span>
              <span style={{ width: SLIDER_SLOT_WIDTH, display: "flex", justifyContent: "flex-end" }}>
                <button type="button" onClick={() => setScale(1)}
                  style={{ padding: "5px 10px", fontSize: 11, color: T.accentSoft, background: "transparent",
                    border: `1px solid ${T.accentSoft}`, borderRadius: 6, cursor: "pointer" }}>1.00x</button>
              </span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: SLIDER_ROW_GAP }}>
              <span style={{ fontSize: 12, color: T.muted, width: SLIDER_LABEL_WIDTH, flexShrink: 0 }}>회전</span>
              <input type="range" className="ui-slider" min={-180} max={180} step={1} value={rotation}
                onChange={(e) => setRotation(Number(e.target.value))}
                style={{ flex: 1, minWidth: 0, "--track-color": T.sliderTrack, "--thumb-color": T.accent,
                  "--fill-percent": `${((rotation + 180) / 360) * 100}%` }} />
              <span style={{ fontSize: 12, color: T.muted, width: 42, textAlign: "right" }}>{rotation}°</span>
              <span style={{ width: SLIDER_SLOT_WIDTH, display: "flex", justifyContent: "flex-end" }}>
                <button type="button" onClick={() => setRotation(0)}
                  style={{ padding: "5px 10px", fontSize: 11, color: T.accentSoft, background: "transparent",
                    border: `1px solid ${T.accentSoft}`, borderRadius: 6, cursor: "pointer" }}>0°</button>
              </span>
            </div>
          </div>

          {shape === "stamp" && (
            <div style={{ paddingTop: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 12, fontWeight: 700, color: T.muted, whiteSpace: "nowrap" }}>테두리 간격</span>
                <div style={{ display: "flex", gap: 6, flex: 1 }}>
                  {Object.entries(PERFORATION_LEVELS).map(([key, level]) => {
                    const active = perforation === key;
                    return (
                      <button key={key} onClick={() => setPerforation(key)}
                        style={{ flex: 1, padding: "8px 0", fontSize: 12, fontWeight: active ? 700 : 500,
                          color: active ? T.onAccent : T.muted, background: active ? T.accent : "transparent",
                          border: `1px solid ${active ? T.accent : T.border}`, borderRadius: 7, cursor: "pointer" }}>
                        {level.label}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {shape === "stamp" && (
            <div style={{ paddingTop: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, fontWeight: 700,
                  color: T.muted, cursor: "pointer", whiteSpace: "nowrap" }}>
                  <input type="checkbox" checked={borderOn} onChange={(e) => setBorderOn(e.target.checked)}
                    style={{ width: 16, height: 16, accentColor: T.accent, cursor: "pointer" }} />
                  여백
                </label>
                <div title={borderOn ? "색상 변경" : "여백을 켜야 색상을 바꿀 수 있음"}
                  onClick={() => borderOn && toggleColorPicker("border", borderColor)}
                  style={{ width: 44, height: 26, borderRadius: 4, background: "#fff",
                    border: `1px solid ${T.border}`, position: "relative", overflow: "hidden",
                    cursor: borderOn ? "pointer" : "default" }}>
                  {borderOn ? <div style={{ position: "absolute", inset: 0, background: borderColor }} /> : (
                    <>
                      <div style={{ position: "absolute", top: "50%", left: "50%", width: 16, height: 2.5,
                        background: T.danger, borderRadius: 2, transform: "translate(-50%,-50%) rotate(45deg)" }} />
                      <div style={{ position: "absolute", top: "50%", left: "50%", width: 16, height: 2.5,
                        background: T.danger, borderRadius: 2, transform: "translate(-50%,-50%) rotate(-45deg)" }} />
                    </>
                  )}
                </div>
              </div>
              {renderColorPicker("border", borderColor, setBorderColor)}
            </div>
          )}

          {shape === "heart" && (
            <div style={{ paddingTop: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 12, fontWeight: 700, color: T.muted }}>모양</span>
                <div style={{ display: "flex", gap: 6, flex: 1 }}>
                  {HEART_VARIANTS.map((pts, idx) => {
                    const active = heartStyle === idx + 1;
                    return (
                      <button key={idx} onClick={() => setHeartStyle(idx + 1)}
                        style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center",
                          padding: "6px 0", background: active ? T.accent : "transparent",
                          border: `1px solid ${active ? T.accent : T.border}`, borderRadius: 7,
                          cursor: "pointer", color: active ? T.onAccent : T.muted }}>
                        <svg width="26" height="26" viewBox="0 0 26 26"><path d={curvePointsToIconPath(pts)} fill="currentColor" /></svg>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {shape === "flower" && (
            <div style={{ paddingTop: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 12, fontWeight: 700, color: T.muted }}>잎 개수</span>
                <div style={{ display: "flex", gap: 6, flex: 1 }}>
                  {[4, 5, 6].map((n) => {
                    const active = petalCount === n;
                    return (
                      <button key={n} onClick={() => setPetalCount(n)}
                        style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center",
                          padding: "6px 0", background: active ? T.accent : "transparent",
                          border: `1px solid ${active ? T.accent : T.border}`, borderRadius: 7,
                          cursor: "pointer", color: active ? T.onAccent : T.muted }}>
