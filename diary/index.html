/* ═══════════ 저장소 ═══════════
   1) IndexedDB — localStorage(5MB)로는 이미지가 금방 넘쳐서 옮겼다. 기존 localStorage 데이터는 처음 한 번 자동 이관.
   2) 백업/복원 — 전 기간 데이터를 .json 파일 하나로 주고받는다. 브라우저 저장소를 지워도 이 파일만 있으면 복구된다.
   ══════════════════════════════ */
const DB_NAME = "stampcal", STORE = "months", META = "meta";

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
      if (!d.objectStoreNames.contains(META)) d.createObjectStore(META);
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return openDB().then((db) => new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  }));
}
const idbGet = (store, key) => tx(store, "readonly", (o) => o.get(key));
const idbSet = (store, key, val) => tx(store, "readwrite", (o) => o.put(val, key));
const idbDel = (store, key) => tx(store, "readwrite", (o) => o.delete(key));
const idbAll = () => openDB().then((db) => new Promise((res, rej) => {
  const t = db.transaction(STORE, "readonly");
  const o = t.objectStore(STORE);
  const out = {};
  const cur = o.openCursor();
  cur.onsuccess = () => {
    const c = cur.result;
    if (!c) { res(out); return; }
    out[c.key] = c.value;
    c.continue();
  };
  cur.onerror = () => rej(cur.error);
}));

// 예전 localStorage 데이터를 한 번만 옮겨온다
async function migrateFromLocalStorage() {
  if (await idbGet(META, "migrated")) return;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || key.indexOf("stampcal:") !== 0) continue;
      const monthKey = key.slice("stampcal:".length);
      const val = JSON.parse(localStorage.getItem(key) || "null");
      if (val) await idbSet(STORE, monthKey, val);
    }
  } catch (e) {}
  await idbSet(META, "migrated", true);
}

// 브라우저가 저장소를 임의로 비우지 않도록 요청 (거절돼도 동작에는 지장 없음)
function requestPersistence() {
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }
}

// 파일 저장 — 환경마다 되는 방법이 달라서 순서대로 시도한다.
// 1) 아티팩트 안: downloads 기능
// 2) 모바일: 공유 시트(navigator.share) — iOS 사파리는 <a download> 로 blob 저장이 막혀 있다
// 3) 그 외: 링크 클릭 방식
// 4) 그래도 안 되면 새 탭으로 열어서 길게 눌러 저장할 수 있게 한다
async function saveFile(filename, blob) {
  if (window.claude && window.claude.use) {
    const d = await window.claude.use("downloads").catch(() => null);
    if (d) { await d.save({ filename, data: blob }); return; }
  }
  const type = blob.type || "application/octet-stream";
  try {
    const file = new File([blob], filename, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;   // 사용자가 공유를 취소함
    // 공유가 안 되면 아래 방식으로 이어서 시도한다
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
  // download 속성을 무시하는 브라우저(구형 iOS 등)를 위해 잠시 뒤 새 탭으로도 열어준다
  setTimeout(() => {
    if (typeof HTMLAnchorElement !== "undefined" && !("download" in HTMLAnchorElement.prototype)) {
      window.open(url, "_blank");
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }, 300);
}


// onlyKey 를 주면 그 달만, 없으면 우표가 들어 있는 모든 달을 담는다
async function buildBackup(onlyKey) {
  const all = await idbAll();
  let months;
  if (onlyKey) months = { [onlyKey]: all[onlyKey] || {} };
  else {
    months = {};
    Object.keys(all).forEach((k) => {
      const v = all[k];
      if (v && v.stamps && Object.keys(v.stamps).length) months[k] = v;   // 빈 달은 뺀다
    });
  }
  return new Blob([JSON.stringify({
    app: "stamp-diary", version: 1, exportedAt: new Date().toISOString(), months,
  })], { type: "application/json" });
}
// 복원한 달 키 목록을 돌려준다 — 화면을 그 달로 옮기는 데 쓴다
async function restoreBackup(text) {
  const parsed = JSON.parse(text);
  const months = parsed && parsed.months;
  if (!months || typeof months !== "object") throw new Error("형식이 다릅니다");
  const keys = Object.keys(months).sort();
  for (const k of keys) await idbSet(STORE, k, months[k]);
  return keys;
}

/* ── 달력을 PNG로 다시 그려서 내보낸다 (화면 캡처가 아니라 캔버스에 새로 그린다) ── */
const NUM_FONT = '"Pretendard Variable", Pretendard, "Gothic A1", -apple-system, sans-serif';
const EXPORT_WIDTH = 3200;   // 내보내는 PNG의 가로 픽셀 — 이 값만 바꾸면 전체가 따라 커진다
const EXPORT_DPI = 300;      // 파일에 적어둘 인쇄 밀도(pHYs) — 화질이 아니라 "종이에 찍힐 크기" 표시

/* PNG에 pHYs 청크를 넣어 300dpi로 표시한다. 이걸 안 적으면 뷰어·인쇄 프로그램이 96dpi로 가정한다.
   픽셀 데이터는 그대로이고 물리 크기 표기만 바뀐다. */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function pngWithDpi(blob, dpi) {
  try {
    const src = new Uint8Array(await blob.arrayBuffer());
    if (src[0] !== 0x89 || src[1] !== 0x50) return blob;          // PNG가 아니면 그대로
    const ppm = Math.round(dpi / 0.0254);
    const chunk = new Uint8Array(21);                              // 길이(4)+타입(4)+데이터(9)+CRC(4)
    const dv = new DataView(chunk.buffer);
    dv.setUint32(0, 9);
    chunk.set([0x70, 0x48, 0x59, 0x73], 4);                        // "pHYs"
    dv.setUint32(8, ppm); dv.setUint32(12, ppm);
    chunk[16] = 1;                                                 // 단위: 미터
    dv.setUint32(17, crc32(chunk.subarray(4, 17)));
    const insertAt = 8 + 25;                                       // 시그니처 + IHDR 뒤
    const out = new Uint8Array(src.length + chunk.length);
    out.set(src.subarray(0, insertAt), 0);
    out.set(chunk, insertAt);
    out.set(src.subarray(insertAt), insertAt + chunk.length);
    return new Blob([out], { type: "image/png" });
  } catch (e) { return blob; }
}

async function renderCalendarPNG(y, m, days, data) {
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }

  // 화면·SNS 공유용 크기 — 150dpi로 인쇄해도 A4보다 크게 나온다(약 271mm 폭)
  const W = EXPORT_WIDTH, margin = Math.round(W * 0.027);
  const cellW = (W - margin * 2) / 7;
  const cellH = cellW * 1.3;
  const k = cellW / 140;                 // 화면 한 칸(약 140px) 대비 배율
  const rows = days.length / 7;
  const headH = 96 * k, dowH = 40 * k;
  const H = Math.round(margin * 2 + headH + dowH + cellH * rows);

  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, W, H);

  // 머리글 — SEPTEMBER 09 ... 2026
  const titleSize = 30 * k;
  const baseY = margin + titleSize;
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#111111";
  ctx.font = `500 ${titleSize}px ${NUM_FONT}`;
  ctx.textAlign = "left";
  const monthText = MONTH[m];
  ctx.fillText(monthText, margin, baseY);
  const mw = ctx.measureText(monthText).width;
  ctx.fillStyle = "#6B6B6B";
  ctx.fillText(pad(m + 1), margin + mw + 14 * k, baseY);
  ctx.fillStyle = "#A8A8A8";
  ctx.font = `400 ${14 * k}px ${NUM_FONT}`;
  ctx.textAlign = "right";
  ctx.fillText(String(y), W - margin, baseY);

  const gridTop = margin + headH;
  const gridBottom = gridTop + dowH + cellH * rows;

  // 요일 머리글
  ctx.textAlign = "center";
  ctx.font = `400 ${11.5 * k}px ${NUM_FONT}`;
  DOW.forEach((n, i) => {
    ctx.fillStyle = i === 0 ? "#C8322A" : i === 6 ? "#2F5AA8" : "#6B6B6B";
    const spaced = n.split("").join(" ");
    ctx.fillText(spaced, margin + cellW * (i + 0.5), gridTop + dowH * 0.68);
  });

  // 격자 — 위쪽 한 줄만 진하게, 나머지는 옅은 회색
  ctx.lineWidth = Math.max(1, 1 * k);
  ctx.strokeStyle = "#E2E2E2";
  for (let c = 0; c <= 7; c++) {
    const x = Math.round(margin + cellW * c) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, gridTop); ctx.lineTo(x, gridBottom); ctx.stroke();
  }
  for (let r = 0; r <= rows; r++) {
    const yy = Math.round(gridTop + dowH + cellH * r) + 0.5;
    ctx.beginPath(); ctx.moveTo(margin, yy); ctx.lineTo(W - margin, yy); ctx.stroke();
  }
  ctx.strokeStyle = "#111111";
  ctx.lineWidth = Math.max(1.5, 1.5 * k);
  ctx.beginPath();
  ctx.moveTo(margin, Math.round(gridTop) + 0.5);
  ctx.lineTo(W - margin, Math.round(gridTop) + 0.5);
  ctx.stroke();

  // 칸 내용
  const inPad = 6 * k;
  for (let i = 0; i < days.length; i++) {
    const { dt, outside } = days[i];
    const col = i % 7, row = Math.floor(i / 7);
    const x = margin + cellW * col, yTop = gridTop + dowH + cellH * row;
    const ks = dkey(dt.getFullYear(), dt.getMonth(), dt.getDate());
    const dow = dt.getDay();

    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.font = `400 ${13 * k}px ${NUM_FONT}`;
    ctx.fillStyle = outside ? "#A8A8A8" : dow === 0 ? "#C8322A" : dow === 6 ? "#2F5AA8" : "#111111";
    ctx.fillText(String(dt.getDate()), x + inPad, yTop + inPad);
    const headBottom = yTop + inPad + 14 * k;

    const stamp = data.stamps && data.stamps[ks];
    if (!stamp) continue;
    let im = null;
    try { im = await loadImage(stamp.src); } catch (e) { continue; }
    const areaX = x + inPad, areaY = headBottom + 2 * k;
    const areaW = cellW - inPad * 2, areaH = yTop + cellH - inPad - areaY;
    if (areaW < 4 || areaH < 4) continue;
    const sub = document.createElement("canvas");
    sub.width = Math.round(areaW); sub.height = Math.round(areaH);
    drawStamp(sub.getContext("2d"), {
      ...drawOptions({ ...DEFAULT_STAMP, ...stamp }),
      canvasW: sub.width, canvasH: sub.height, img: im, checker: false,
    });
    ctx.drawImage(sub, areaX, areaY);
  }

  const blob = await new Promise((res) => cv.toBlob(res, "image/png"));
  return pngWithDpi(blob, EXPORT_DPI);
}

/* ── 달력 칸의 우표 — 저장된 원본 + 설정으로 그때그때 다시 그린다 ── */
function CellStamp({ stamp }) {
  const ref = useRef(null);
  const [img, setImg] = useState(null);

  useEffect(() => {
    let alive = true;
    loadImage(stamp.src).then((im) => { if (alive) setImg(im); }).catch(() => {});
    return () => { alive = false; };
  }, [stamp.src]);

  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const paint = () => {
      const box = canvas.getBoundingClientRect();
      if (!box.width || !box.height) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(box.width * dpr);
      canvas.height = Math.round(box.height * dpr);
      drawStamp(canvas.getContext("2d"), {
        ...drawOptions({ ...DEFAULT_STAMP, ...stamp }),
        canvasW: canvas.width, canvasH: canvas.height, img, checker: false,
      });
    };
    paint();
    const ro = new ResizeObserver(paint);
    ro.observe(canvas);
    return () => ro.disconnect();
  }, [stamp, img]);

  return <canvas ref={ref} />;
}

function App() {
  const today = useMemo(() => new Date(), []);
  const [cur, setCur] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
  const [data, setData] = useState({});
  const [editing, setEditing] = useState(null);
  const calRef = useRef(null), sheetRef = useRef(null), wsRef = useRef(null), calbodyRef = useRef(null);
  const [saving, setSaving] = useState(false);
  const [notice, setNotice] = useState("");
  const [showEditor, setShowEditor] = useState(true);   // 에디터 UI — 기본 켜짐
  const [confirmWipe, setConfirmWipe] = useState(false);

  const toggle = (
    <label className="toggle">
      <input type="checkbox" checked={showEditor}
        onChange={(e) => setShowEditor(e.target.checked)} />
      에디터 UI
    </label>
  );
  // 달력 칸·편집 패널·버튼 줄 바깥을 누르면 선택을 푼다
  useEffect(() => {
    if (!editing) return;
    const onDown = (e) => {
      const t = e.target;
      if (t instanceof Element && t.closest(".cell, .editorpane, .bar, .toggle, .footbar")) return;
      setEditing(null);
    };
    document.addEventListener("mousedown", onDown);
    return () => document.removeEventListener("mousedown", onDown);
  }, [editing]);

  useEffect(() => {
    if (!notice) return;
    const t = setTimeout(() => setNotice(""), 4000);
    return () => clearTimeout(t);
  }, [notice]);
  useEffect(() => {
    if (!confirmWipe) return;
    const t = setTimeout(() => setConfirmWipe(false), 5000);
    return () => clearTimeout(t);
  }, [confirmWipe]);

  const y = cur.getFullYear(), m = cur.getMonth();
  const monthKey = `${y}-${pad(m + 1)}`;
  const restoreInput = useRef(null);

  // 첫 실행 — 예전 localStorage 데이터 이관, 저장소 보존 요청
  const [ready, setReady] = useState(false);
  useEffect(() => {
    let alive = true;
    (async () => {
      try { await migrateFromLocalStorage(); } catch (e) {}
      requestPersistence();
      if (alive) setReady(true);
    })();
    return () => { alive = false; };
  }, []);

  useEffect(() => {
    if (!ready) return;
    let alive = true;
    idbGet(STORE, monthKey).then((v) => { if (alive) setData(v || {}); }).catch(() => { if (alive) setData({}); });
    return () => { alive = false; };
  }, [monthKey, ready]);

  const persist = async (next) => {
    setData(next);
    try { await idbSet(STORE, monthKey, next); }
    catch (e) { setNotice("저장하지 못했습니다. 저장 공간을 확인해 주세요."); return false; }
    return true;
  };

  const days = useMemo(() => {
    const first = new Date(y, m, 1).getDay();
    const len = new Date(y, m + 1, 0).getDate();
    const rows = Math.ceil((first + len) / 7);
    const out = [];
    for (let i = 0; i < rows * 7; i++) {
      const d = i - first + 1;
      const dt = new Date(y, m, d);
      out.push({ dt, outside: d < 1 || d > len });
    }
    return out;
  }, [y, m]);

  // 창 크기가 바뀔 때마다 달력이 한 화면에 들어오도록 칸 폭을 다시 계산한다.
  // 가로가 넓어도 세로가 모자라면 칸을 줄여서, 달력과 에디터가 언제나 함께 보이게 한다.
  useLayoutEffect(() => {
    const fit = () => {
      const ws = wsRef.current, sheet = sheetRef.current, cal = calRef.current;
      if (!ws || !sheet || !cal) return;
      const cs = getComputedStyle(sheet);
      const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
      const wsCs = getComputedStyle(ws);
      const wsInner = ws.clientWidth - parseFloat(wsCs.paddingLeft) - parseFloat(wsCs.paddingRight);
      const colW = Math.max(380, wsInner - (showEditor ? 372 + 16 : 0));   // 남는 폭 전부 사용
      const maxCw = (colW - padX) / 7;                       // 가로로 허용되는 칸 폭

      // 세로 예산 — 달력 격자 위/아래에 있는 것들만 직접 잰다.
      // (페이지 전체 높이에서 빼는 방식은 에디터 높이에 끌려다녀서 되먹임이 생긴다)
      const bodyTop = document.body.getBoundingClientRect().top;
      const calRect = cal.getBoundingClientRect();
      const bodyRect = calbodyRef.current ? calbodyRef.current.getBoundingClientRect() : calRect;
      const above = calRect.top - bodyTop;                                   // 위쪽(저작권 줄·버튼 줄·머리글 등)
      const below = (bodyRect.bottom - calRect.bottom)
        + parseFloat(getComputedStyle(document.body).paddingBottom);         // 아래쪽(꼬리말·하단 버튼 줄)
      const dowH = cal.firstElementChild ? cal.firstElementChild.getBoundingClientRect().height : 34;
      const rows = Math.max(1, Math.round(days.length / 7));
      // 세로 예산 — 달력은 언제나 화면 안에 들어오게 한다(에디터 높이와 무관)
      const budget = window.innerHeight - above - below - 10;
      const byHeight = ((budget - dowH) / rows) / 1.3;
      const cw = Math.max(56, Math.min(maxCw, byHeight));
      cal.style.setProperty("--cw", cw + "px");
      ws.style.setProperty("--calw", Math.ceil(cw * 7 + padX) + "px");  // 달력 상자도 같이 맞춘다
    };
    fit();
    const raf = requestAnimationFrame(fit);   // 레이아웃이 바뀐 뒤 한 번 더 맞춘다
    window.addEventListener("resize", fit);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", fit); };
  }, [days.length, showEditor, monthKey]);


  return (
    <>
      <div className="legal">
        <span>
          <b className="brand">Stamp Diary</b>&nbsp;|&nbsp;Copyright 2026. MUJIMUJI Stamp Calendar&nbsp;|&nbsp;본 서비스(에디터)의 무단 복제, 확장 및 배포를 금지합니다.&nbsp;|&nbsp;
          <a href="https://oauka.github.io/newluvbit_public/privacy_policy.html"
            target="_blank" rel="noopener noreferrer">개인 정보 처리 방침</a>
        </span>
        <span>문의 및 버그 제보 Mail : <a href="mailto:mujimuji.purity012@aleeas.com">mujimuji.purity012@aleeas.com</a></span>
      </div>

      <div ref={wsRef} className={"workspace" + (showEditor ? "" : " noeditor")}>
      <div className="bar">
        <span className="now">{today.getFullYear()}.{pad(today.getMonth() + 1)}.{pad(today.getDate())}</span>
        <button className="btn" onClick={() => setCur(new Date(y, m - 1, 1))}>← 이전</button>
        <button className="btn" onClick={() => setCur(new Date(today.getFullYear(), today.getMonth(), 1))}>오늘</button>
        <button className="btn" onClick={() => setCur(new Date(y, m + 1, 1))}>다음 →</button>
        <button className="btn" disabled={saving} onClick={async () => {
          setSaving(true);
          try {
            const blob = await renderCalendarPNG(y, m, days, data);
            await saveFile(`calendar-${y}-${pad(m + 1)}.png`, blob);
          } catch (err) {
            if (!err || err.code !== "declined") setNotice("이미지를 저장하지 못했습니다.");
          } finally { setSaving(false); }
        }}>{saving ? "저장 중…" : "이미지 저장"}</button>

        {notice && <span className="notice">{notice}</span>}
        {!showEditor && toggle}
      </div>

      <div className="calbody" ref={calbodyRef}>
      <div className="sheet" ref={sheetRef}>
        <div className="head">
          <span className="m">{MONTH[m]}</span>
          <span className="ko">{pad(m + 1)}</span>
          <span className="y">{y}</span>
        </div>

        <div className="cal" ref={calRef}>
          {DOW.map((n, i) => (
            <div key={n + i} className={"dow" + (i === 0 ? " s" : i === 6 ? " t" : "")}>{n}</div>
          ))}
          {days.map(({ dt, outside }, i) => {
            const ks = dkey(dt.getFullYear(), dt.getMonth(), dt.getDate());
            const dow = dt.getDay();
            const stamp = data.stamps && data.stamps[ks];
            const selected = editing && editing.date === ks;
            return (
              <div key={i}
                className={"cell" + (outside ? " out" : "") + (dow === 0 ? " s" : "") +
                  (dow === 6 ? " t" : "") + (selected ? " sel" : "")}
                onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add("drop"); }}
                onDragLeave={(e) => e.currentTarget.classList.remove("drop")}
                onDrop={(e) => {
                  e.preventDefault();
                  e.currentTarget.classList.remove("drop");
                  const f = e.dataTransfer.files[0];
                  if (!f) return;
                  const reader = new FileReader();
                  reader.onload = () => shrink(reader.result).then((s) =>
                    setEditing({ date: ks, initial: { ...(stamp || {}), src: s, offX: 0, offY: 0, scale: 1, rotation: 0 } }));
                  reader.readAsDataURL(f);
                }}>
                <span className="n">{dt.getDate()}</span>
                <button className="slotbtn"
                  aria-label={ks + (stamp ? " 우표 편집" : " 선택")}
                  aria-pressed={selected ? "true" : "false"}
                  onClick={() => setEditing({ date: ks, initial: stamp || null })}>
                  {stamp ? <CellStamp stamp={stamp} /> : null}
                </button>
                {stamp && (
                  <button className="delbtn" title="우표 삭제" aria-label={ks + " 우표 삭제"}
                    onClick={(e) => {
                      e.stopPropagation();
                      const stamps = { ...(data.stamps || {}) };
                      delete stamps[ks];
                      persist({ ...data, stamps });
                      if (selected) setEditing(null);
                    }}>✕</button>
                )}
              </div>
            );
          })}
        </div>

        <div className="foot">
          <span>{y} / {pad(m + 1)}</span>
          <span className="ko">칸을 눌러 선택하면 오른쪽에서 우표를 편집합니다</span>
        </div>
      </div>

      <div className="footbar">
        <button className="btn" onClick={async () => {
          if (!confirmWipe) { setConfirmWipe(true); return; }
          setConfirmWipe(false);
          const next = { ...data };
          delete next.stamps;
          if (await persist(next)) setEditing(null);   // 지운 결과는 달력에 바로 보이므로 따로 알리지 않는다
        }}>{confirmWipe ? "한 번 더 누르면 삭제됩니다" : "전체 이미지 삭제"}</button>
        <span style={{ fontSize: 11, color: "#A8A8A8" }}>
          이 달({y}.{pad(m + 1)})에 붙인 우표를 모두 지웁니다
        </span>

        <span className="right">
        <button className="btn" title="보고 있는 달의 우표를 파일로 내려받습니다"
          onClick={async () => {
            try {
              await saveFile(`stamp_diary_${y}${pad(m + 1)}.json`, await buildBackup(monthKey));
            } catch (err) {
              if (!err || err.code !== "declined") setNotice("백업 파일을 만들지 못했습니다.");
            }
          }}>백업</button>

        <button className="btn" title="우표가 들어 있는 모든 달을 한 파일로 내려받습니다"
          onClick={async () => {
            try {
              const blob = await buildBackup();
              const n = Object.keys(JSON.parse(await blob.text()).months).length;
              if (!n) { setNotice("백업할 우표가 없습니다."); return; }
              const stamp = `${today.getFullYear()}${pad(today.getMonth() + 1)}${pad(today.getDate())}`;
              await saveFile(`stamp_diary_all_${stamp}.json`, blob);
              setNotice(`${n}개월치를 백업했습니다.`);
            } catch (err) {
              if (!err || err.code !== "declined") setNotice("전체 백업 파일을 만들지 못했습니다.");
            }
          }}>전체 백업</button>

        <button className="btn" title="백업 파일을 불러와 되돌립니다"
          onClick={() => restoreInput.current && restoreInput.current.click()}>복원</button>
        <input ref={restoreInput} type="file" accept="application/json,.json" style={{ display: "none" }}
          onChange={async (e) => {
            const f = e.target.files && e.target.files[0];
            e.target.value = "";
            if (!f) return;
            try {
              const keys = await restoreBackup(await f.text());
              setEditing(null);
              if (keys.length) {
                const [ky, km] = keys[0].split("-");
                setCur(new Date(+ky, +km - 1, 1));      // 불러온 달로 화면을 옮긴다
                setData((await idbGet(STORE, keys[0])) || {});
                setNotice(keys.length > 1
                  ? `${keys.length}개월 복원 완료 — ${keys[0].replace("-", ".")} 화면으로 이동`
                  : `${keys[0].replace("-", ".")} 복원 완료`);
              } else setNotice("백업 파일에 담긴 달이 없습니다.");
            } catch (err) { setNotice("복원하지 못했습니다 — 백업 파일이 맞는지 확인해 주세요."); }
          }} />

        </span>
      </div>
      </div>

      {showEditor && toggle}
      {showEditor && (
        <StampEditorPanel
          key={editing ? editing.date : "none"}
          date={editing ? editing.date : null}
          initial={editing ? editing.initial : null}
          onClose={() => setShowEditor(false)}
          onDelete={() => {
            if (!editing) return;
            const stamps = { ...(data.stamps || {}) };
            delete stamps[editing.date];
            persist({ ...data, stamps });
            setEditing(null);
          }}
          onApply={(state) => {
            // 붙인 뒤에도 패널은 열어둔다 — 바로 이어서 손볼 수 있게
            if (!editing) return false;
            const next = { ...data, stamps: { ...(data.stamps || {}), [editing.date]: state } };
            return persist(next);
          }}
        />
      )}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
